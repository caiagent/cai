[project]
name = "cai"
version = "0.1.23"
description = "A small LLM agent, built from scratch layer by layer."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "urllib3",
    "mcp==2.3.0",
]

[project.optional-dependencies]
# what the examples/extensions/markdown renderer uses when present: a CommonMark
# parser and a syntax highlighter. optional - without them it renders plainly.
markdown = ["markdown-it-py", "pygments"]
dev = ["pytest", "markdown-it-py", "pygments"]

[project.scripts]
cai = "cai.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# builtins/ holds drop-in MCP servers (*.py, spawned as scripts), skill files
# (*.md) and extension bundles (extensions/<name>/init.py). they live beside the package but are not importable modules, so they
# must be declared as package data or a non-editable install drops them.
[tool.setuptools.package-data]
cai = ["builtins/mcps/*.py", "builtins/skills/*.md", "builtins/extensions/*/*.py", "py.typed"]
